name: sync-upstream
on:
  schedule:
    - cron: "17 8 * * 1"   # Mondays 08:17 UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream/main into fork main
        run: |
          git config user.name "plannotator-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/backnotprop/plannotator.git
          git fetch upstream
          git merge --no-edit upstream/main
          git push origin main
# CF Pages Git-integration auto-builds + deploys on this push.
